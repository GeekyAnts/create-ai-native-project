name: Publish alias to npm

# Publishes the `create-ai-native-starter` alias package (in create-ai-native-starter/).
#
# Trigger: push a tag `starter-vX.Y.Z`, or run manually (workflow_dispatch).
# This is intentionally SEPARATE from the main "Publish to npm" workflow (which
# fires on GitHub Releases tagged vX.Y.Z) so the alias — a thin wrapper that only
# needs republishing on a create-ai-native-project MAJOR — is never coupled to
# the main release cadence. (The main workflow triggers on `release`, not on tag
# pushes, so a `starter-v*` tag never trips it.)
#
# Auth is npm Trusted Publishing (OIDC) — no token/secret. Configure the npm
# Trusted Publisher for the `create-ai-native-starter` package to match:
#   repository:  GeekyAnts/create-ai-native-project
#   workflow:    publish-starter.yml
#   environment: release
on:
  push:
    tags: ["starter-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for npm provenance + OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gated GitHub Actions environment; the name must match the npm Trusted
    # Publisher config exactly (OIDC matches the environment claim).
    environment: release
    defaults:
      run:
        working-directory: create-ai-native-starter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC Trusted Publishing requires npm >= 11.5.1. Node 24 ships npm 11.x;
      # pin the latest 11.x (npm@latest is 12, with stricter engines).
      - name: Upgrade npm
        run: |
          npm install -g npm@11
          node --version
          npm --version

      # On a starter-vX.Y.Z tag, make sure it matches the alias package version.
      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#starter-v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ($TAG) does not match package.json version ($PKG)."
            exit 1
          fi

      # Thin wrapper — no build/prepublish step; publish just packs the 3 files.
      # Auth via OIDC Trusted Publishing — no NODE_AUTH_TOKEN needed.
      - name: Publish
        run: npm publish --provenance --access public
