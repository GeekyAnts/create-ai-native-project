name: Publish to npm

# Publishes the package to npm when a GitHub Release is published (recommended
# flow: bump the version, then cut a release tagged vX.Y.Z). Can also be run
# manually. Auth is via npm Trusted Publishing (OIDC) — no token/secret needed;
# it relies on `id-token: write` + the `release` environment matching the npm
# Trusted Publisher config. Provenance is attached automatically.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gated GitHub Actions environment. The name must match the npm Trusted
    # Publisher config exactly (OIDC matches the environment claim). Add
    # protection rules (required reviewers / allowed branches) in
    # Settings → Environments → release.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # OIDC Trusted Publishing requires npm >= 11.5.1. Node 24 ships npm 11.x;
      # pin the latest 11.x to be sure (npm@latest is 12 with stricter engines).
      # Print versions so the log confirms which npm actually runs the publish.
      - name: Upgrade npm
        run: |
          npm install -g npm@11
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      # For a release, make sure the tag (vX.Y.Z) matches package.json version so
      # we never publish a mismatched version.
      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version ($PKG)."
            exit 1
          fi

      # `npm publish` runs prepublishOnly (typecheck + test + build) first.
      # Auth via OIDC Trusted Publishing — no NODE_AUTH_TOKEN needed.
      - name: Publish
        run: npm publish --provenance --access public
